name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, tests, release gate on the committed run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Tests (symbols, tracing, codegen, models, fuzzer, isolation)
        run: |
          set -o pipefail
          pytest -m "not slow" 2>&1 | tee unit.log || { echo "::error title=tests::$(grep -E 'FAILED|Error' unit.log | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - name: Release gate on the committed full run
        run: stc gate --profile full

  pipeline:
    name: pipeline end to end (quick profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Quick pipeline
        run: |
          set -o pipefail
          pytest -m slow -x 2>&1 | tee slow.log || { echo "::error title=slow tests::$(grep -E 'Error|assert|FAIL' slow.log | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }

  thunder:
    name: thunder bridge (Thunder and this compiler on the same calls)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - name: Install torch 2.8 (CPU) and lightning-thunder 0.2.6, versions that agree
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install lightning-thunder==0.2.6
          pip install -e .
      - name: Replay the workloads
        run: |
          set -o pipefail
          python scripts/thunder_bridge.py --scale 0.25 2>&1 | tee bridge.log || { echo "::error title=thunder bridge::$(tail -12 bridge.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: thunder-bridge, path: runs/thunder_bridge.json }

  web:
    name: dashboard (lint, types, unit, build, browser + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
